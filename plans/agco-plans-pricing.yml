description: >-
  AGCO publishes NO API plans, tiers or prices. Both of its API surfaces are contract-gated rather
  than sold. The AGCO Technical Support (ATS) API at secure.agco-ats.com serves its Swagger document
  anonymously but issues credentials only through the AGCO EDT Support Portal — the login page reads
  "This site now uses login credentials from the EDT Support Portal. For access, please contact
  EDT_Support@agcocorp.com". AgCommand telematics access is provisioned by AGCO dealers as part of an
  equipment sale, lease or fleet-management agreement; AGCO's 2015 announcement described API access
  as available to "approved third-party developers and service providers", i.e. by approval, not by
  purchase.
notes: >-
  plan_count is 0 because nothing is published, not because nothing is charged for. Third-party
  trade press has reported a list price for factory-installed AgCommand hardware including a
  multi-year subscription, but that is equipment pricing reported by others, not an AGCO-published
  API plan, so it is deliberately not recorded here as a plan.

description: 'The entity-relationship graph of the AGCO Technical Support (ATS) API — the platform behind
  AGCO''s Electronic Diagnostic Tool. It is not a telematics model: it is a dealer software-distribution
  and content-publishing model, organised into six .NET namespaces that behave as bounded contexts.'

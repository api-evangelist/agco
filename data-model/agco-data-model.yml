domains:
- namespace: UpdateSystem
  label: Software update distribution
  detail: Clients (installed EDT instances), Packages, PackageTypes, Bundles, UpdateGroups and their Subscriptions,
    PriorityPackages, check-in results and update metrics.
- namespace: ContentSubmission
  label: Content publishing pipeline
  detail: ContentDefinitions and their Attributes, ContentSubmissions, ContentReleaseVersions and Releases
    — how service content is submitted, built and released to dealers.
- namespace: BuildSystem
  label: Build orchestration
  detail: Jobs, JobActivities, Activities, ActivitySteps, Steps, Agents and their runs — a build pipeline
    exposed as an API.
- namespace: GlobalResources
  label: Localisation
  detail: Languages, StringDefinitions, StringTranslations, TranslationSets, TranslationRequests and GlobalImages
    — the translation workflow for dealer-facing content.
- namespace: AuthorizationCodes
  label: Authorization codes
  detail: AuthorizationCodeDefinitions, AuthorizationCodes, Categories and contact information — the codes
    that unlock machine functions and service operations.
- namespace: DealerDB
  label: Dealers and licensing
  detail: Dealers, DealersPerCountry, Licenses, Vouchers, VoucherHistory and EDTLiteRegistration.
- namespace: AGCOPowerServices
  label: AGCO Power aftermarket
  detail: ECU (activation/deactivation/damage reporting), ProductionData (engine calibration) and voucher
    UserStatus against AGCO Power Web Services.
- namespace: Communication
  label: File exchange
  detail: FileUploads, FileUploadTypes and indexed report queries.
- namespace: API
  label: Platform primitives
  detail: User, AuthenticatedUser, Role, Permission, UserEffectivePermission, Log, ApiError and the paged-response
    envelope.

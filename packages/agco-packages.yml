description: >-
  AGCO publishes no client SDK for any of its APIs. What it does publish on npm is a family of
  first-party SERVER-side Node.js libraries — the "harvester" stack it built to implement its own
  JSON:API surface, plus supporting logging, migration and messaging utilities. These are the tools
  AGCO used to BUILD its APIs, not tools a consumer uses to CALL them, so no SDKs pointer is emitted
  from this record. Every one of them is abandoned: the newest release in the set is
  harvesterjs 3.2.4 from 2018-07-06, and the AGCO GitHub organization has had no push to any
  repository since 2019.

openapi: 3.2.0
info:
  version: v1
  title: Content Submission Types API
servers:
- url: https://secure.agco-ats.com
tags:
- name: ContentSubmissionTypes
paths:
  /api/v2/ContentSubmissionTypes:
    get:
      tags:
      - ContentSubmissionTypes
      summary: Returns available Content Submission Types
      description: No Documentation Found.
      operationId: ContentSubmissionTypes_GetContentSubmissionTypes
      parameters:
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
        default:
          description: API Error Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API.Models.ApiError'
            text/json:
              schema:
                $ref: '#/components/schemas/API.Models.ApiError'
            application/xml:
              schema:
                $ref: '#/components/schemas/API.Models.ApiError'
            text/xml:
              schema:
                $ref: '#/components/schemas/API.Models.ApiError'
      deprecated: false
    post:
      tags:
      - ContentSubmissionTypes
      summary: Add a Content Submission Type
      description: No Documentation Found.
      operationId: ContentSubmissionTypes_PostContentSubmissionType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                format: int32
                type: integer
            text/json:
              schema:
                format: int32
                type: integer
            application/xml:
              schema:
                format: int32
                type: integer
            text/xml:
              schema:
                format: int32
                type: integer
        default:
          description: API Error Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API.Models.ApiError'
            text/json:
              schema:
                $ref: '#/components/schemas/API.Models.ApiError'
            application/xml:
              schema:
                $ref: '#/components/schemas/API.Models.ApiError'
            text/xml:
              schema:
                $ref: '#/components/schemas/API.Models.ApiError'
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
          text/json:
            schema:
              $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
          application/xml:
            schema:
              $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
          text/xml:
            schema:
              $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
        description: The Content Submission Type
        required: true
  /api/v2/ContentSubmissionTypes/{id}:
    get:
      tags:
      - ContentSubmissionTypes
      summary: Retrieves a Content Submission Type by its ID
      description: No Documentation Found.
      operationId: ContentSubmissionTypes_GetContentSubmissionType
      parameters:
      - name: id
        in: path
        description: The ID of the Content Submission Type
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
            text/json:
              schema:
                $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
            application/xml:
              schema:
                $ref: '#/components/schemas/ContentSubmission.Shared.BusinessEntities.ContentSubmissionType'
            text/xml:
              schema:

source: >-
  Searched AGCO's published documentation for rate limits on 2026-09-04 and read the live AGCO ATS
  contract (openapi/agco-ats-api-openapi.json, fetched from
  https://secure.agco-ats.com/swagger/docs/v1). The contract declares 285 operations, ZERO header
  parameters, and only three response codes anywhere — 200, 204 and an untyped `default`. No 429 and
  no throttling response is described. AGCO publishes no rate-limit documentation on any reachable
  page.
reconciled: true

description: >-
  AGCO documents no rate limits for any of its APIs, and — more consequentially for a client — its
  contract signals none at runtime either. There is no RateLimit-*, no X-RateLimit-*, no Retry-After
  and no 429 anywhere in the 285-operation ATS contract, so a caller cannot discover its remaining
  budget, cannot tell a throttle from any other failure, and has nothing to back off against. Any
  throughput ceiling that exists is a term of the dealer/OEM agreement, not something the API tells
  you about.
notes: >-
  An honest zero. limit_count: 0 records "checked, nothing published", not "not checked". Recorded
  after reading the full contract, not inferred from the absence of a docs page.

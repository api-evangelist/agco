- aid: agco:agco-ats-api
  name: AGCO ATS API
  description: >-
    The AGCO Technical Support (ATS) API behind AGCO's Electronic Diagnostic Tool (EDT) and dealer
    software distribution platform. Publishes 285 operations across 55 tags covering authorization
    codes and vouchers, dealer and client records, content submission and release, software packages,
    update groups and subscriptions, translation sets, users, roles and permissions, and AGCO Power
    aftermarket services (ECU activation, engine production data, IQA codes). Served from
    secure.agco-ats.com with a public Swagger UI; calling it requires EDT Support Portal credentials.
  humanURL: https://secure.agco-ats.com/swagger
  baseURL: https://secure.agco-ats.com

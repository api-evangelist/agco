maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
- FN: APIs.json
  email: info@apis.io
description: >-
  AGCO is a global manufacturer of agricultural machinery and precision-ag technology — Fendt, Massey Ferguson, Valtra,
  Challenger, GSI and PTx. Its one publicly reachable machine-readable contract is the AGCO Technical Support (ATS) API
  at secure.agco-ats.com: a Swagger 2.0 document with 285 operations across 55 tags, served with a public Swagger UI,
  covering dealer records, authorization codes and vouchers, software package distribution to Electronic Diagnostic Tool
  (EDT) installations, a content submission and release pipeline, translation workflow, and AGCO Power aftermarket
  services. AGCO also publishes three first-party JSON:API profiles standardising filtering, search and change events.
  The AgCommand telematics API announced in 2015 for third-party developers has no reachable public documentation: the
  developer portal at developer.agcocorp.com no longer publishes and api.agcocorp.com is an API Gateway that
  authenticates every path.

description: >-
  AGCO is a global leader in the design, manufacture, and distribution of agricultural machinery and precision ag
  technology. The AGCO AgCommand API enables approved third-party developers and service providers to access machine
  telemetry data, location tracking, and performance metrics from AGCO Connect-ready equipment including Fendt, Massey
  Ferguson, Challenger, and Valtra brands.
